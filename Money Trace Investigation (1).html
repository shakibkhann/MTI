<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Trace Investigation</title>
<style>
:root{--bg:#060d1f;--bg2:#0b1630;--card:#0f1d3d;--line:#1c3160;--tx:#fff;--mu:#a9b8d6;--ac:#22d3ee;--ac2:#3b82f6;--ok:#34d399;--wa:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,13,31,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;color:#fff;text-decoration:none}
.logo small{display:block;font-size:9px;font-weight:600;color:var(--mu);letter-spacing:1.5px}
#mb{background:none;border:1px solid var(--line);color:#fff;border-radius:8px;padding:8px 12px;font-size:18px}
nav#m{display:none;flex-direction:column;padding-bottom:12px}
nav#m.o{display:flex}
nav a{color:var(--mu);text-decoration:none;padding:10px 4px;border-bottom:1px solid var(--line)}
nav a.on,nav a:hover{color:var(--ac)}
@media(min-width:900px){#mb{display:none}nav#m{display:flex!important;flex-direction:row;gap:14px;padding:0}nav a{border:0;padding:4px;font-size:14px}}
section{padding:36px 0}
h1{font-size:clamp(28px,6vw,48px);line-height:1.15;margin:0 0 14px}
h2{font-size:clamp(22px,4vw,32px);margin:0 0 14px}
h3{margin:0 0 6px;font-size:18px}
p{margin:0 0 12px;color:var(--mu)}
.hero{background:radial-gradient(600px 300px at 80% 0,rgba(34,211,238,.18),transparent),var(--bg);padding:44px 0}
.btn{display:inline-block;border:0;cursor:pointer;font:600 16px system-ui;padding:14px 20px;border-radius:10px;text-decoration:none;text-align:center;min-height:48px}
.p{background:linear-gradient(90deg,var(--ac2),var(--ac));color:#04122b}
.s{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}
.g{display:grid;gap:14px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.free{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:99px;padding:2px 10px}
.n{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#04122b;font-weight:800;display:grid;place-items:center;margin-bottom:8px}
.band{background:linear-gradient(90deg,#0d2a5a,#0b3d57);border:1px solid var(--ac);border-radius:14px;padding:20px;margin:20px 0}
.warn{border:1px solid #f59e0b;background:rgba(245,158,11,.08);border-radius:14px;padding:18px}
.warn p{color:#fde9c0}
label{display:block;font-size:14px;margin:12px 0 4px;color:#dbe6ff}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:12px;font:16px system-ui}
input:focus,select:focus,textarea:focus,.btn:focus,a:focus{outline:2px solid var(--ac);outline-offset:2px}
.big{font-size:44px;font-weight:800;color:var(--ac)}
ul.t{padding-left:18px;color:var(--mu)}
ul.t li{margin:4px 0}
.zero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.zero div{background:var(--bg2);border:1px solid var(--ok);border-radius:10px;padding:12px;text-align:center;font-weight:700}
.zero span{display:block;color:var(--ok);font-size:22px}
#wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ac);color:#04122b;font-weight:700;text-decoration:none;border-radius:99px;padding:12px 18px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;line-height:1.2}
#wa small{display:block;font-size:10px;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(59,130,246,.2);color:#9cc4ff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
tr.sel{background:rgba(34,211,238,.08)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.steps span{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--mu)}
.steps span.d{background:var(--ac);color:#04122b;border-color:var(--ac);font-weight:700}
footer{border-top:1px solid var(--line);padding:26px 0 90px;font-size:13px;color:var(--mu)}
footer a{margin-right:12px}
.flow{stroke-dasharray:6 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-12}}
.pl{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{opacity:.35;transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){.flow,.pl{animation:none}}
</style></head><body>

<g fill="#0b1630" stroke="#22d3ee" stroke-width="2"><circle class="pl" cx="150" cy="45" r="7"/><circle class="pl" cx="160" cy="100" r="7" style="animation-delay:.4s"/><circle class="pl" cx="150" cy="150" r="7" style="animation-delay:.8s"/></g>
<g><circle cx="55" cy="62" r="17" fill="#0b1630" stroke="#f87171" stroke-width="2"/><circle cx="50" cy="63" r="2" fill="#f87171"/><circle cx="60" cy="63" r="2" fill="#f87171"/><rect x="36" y="82" width="38" height="30" rx="8" fill="#1c3160"/><rect x="26" y="112" width="58" height="8" rx="3" fill="#22d3ee" opacity=".6"/><text x="55" y="140" fill="#a9b8d6" font-size="11" text-anchor="middle">Scammer</text></g>
<g><rect x="250" y="55" width="46" height="84" rx="8" fill="#0f1d3d" stroke="#22d3ee" stroke-width="2"/><text class="pl" x="273" y="88" fill="#fbbf24" font-size="11" text-anchor="middle">OTP?</text><text x="273" y="106" fill="#f87171" font-size="9" text-anchor="middle">Fake link</text><text x="273" y="160" fill="#a9b8d6" font-size="11" text-anchor="middle">Victim</text></g>
<text x="180" y="184" fill="#a9b8d6" font-size="10" text-anchor="middle">Phishing • Fake links • OTP requests</text></svg><figcaption style="font-size:13px;color:var(--mu)">Scammers use the network to send fake links, impersonate banks and ask for OTP/PIN. Never share them — report instead.</figcaption></figure>`;
const Zero=()=>`<div class="zero"><div><span>₹0</span>Investigation</div><div><span>₹0</span>Investigation Report</div><div><span>₹0</span>Recovery Fee</div><div><span>0%</span>Of recovered money</div></div>`;
const Steps=()=>`<div class="g g4">${[["Tell Us What Happened","Submit your fraud details and available evidence through our Google Form."],["₹100 Consultation","Pay ₹100 after submitting your case details and discuss your case with our team for up to 30 minutes."],["Free Investigation","We analyze publicly available information and the evidence legally provided by you."],["Findings & Reporting Guidance","If useful leads are found, we provide findings in a clear report and explain how you can report them to the appropriate bank, platform or cybercrime authority."]].map((s,i)=>`<div class="c"><div class="n">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div>`;
const CtaBand=()=>`<div class="band"><h2 style="margin-bottom:6px">Start with a Free Investigation</h2><p style="color:#d6e6ff">Submit your case details, then book your ₹100 consultation (30 minutes).</p><a class="btn p" href="${CONFIG.FORM_URL}" target="_blank" rel="noopener">Report a Fraud</a></div>`;
const NoSecrets=`<p style="font-size:13px;border-left:3px solid #f59e0b;padding-left:10px">Never share your OTP, UPI PIN, ATM PIN, CVV, internet-banking password, email password, social-media password or any authentication code. We will never ask for them.</p>`;
const F=(l,n,t="text",req=false)=>`<label for="${n}">${l}${req?" *":""}</label><input id="${n}" name="${n}" type="${t}" ${req?"required":""} autocomplete="off">`;
/* ===== Pages ===== */
const P={
home:()=>`<section class="hero"><h1>Think You’ve Been Scammed? Let Us Investigate the Evidence.</h1><p style="font-size:18px">Share the details of your suspected online fraud. Money Trace Investigation helps analyze available evidence and identify useful leads using lawful investigation methods.</p><div class="g g2" style="max-width:520px"><a class="btn p" href="${CONFIG.FORM_URL}" target="_blank" rel="noopener">Report a Fraud</a><a class="btn s" href="#consult">₹100 Consultation</a></div></section>
${Anim()}${CtaBand()}<section><h2>How it works</h2>${Steps()}</section>
<section><h2>Why Money Trace Investigation?</h2><div class="g g3">${["Free investigation","Transparent ₹100 consultation","No recovery commission","Evidence-focused approach","Privacy-conscious process","Lawful investigation methods","24/7 consultation availability"].map(t=>`<div class="c">✔ ${t}</div>`).join("")}</div></section>
<section><h2>Simple pricing</h2>${Zero()}</section><section>${Warn()}</section>`,
report:()=>`<section><h1>Report a Fraud</h1><p>Fill in our Google Form with your case details. It opens in a new tab, so you can return here afterwards to pay ₹100 and book your consultation.</p>${Anim()}${NoSecrets}<div class="c" style="max-width:520px"><div class="steps"><span>1. Submit case details</span><span>2. Pay ₹100</span><span>3. Enter Transaction ID</span></div><a class="btn p" style="width:100%" href="${CONFIG.FORM_URL}" target="_blank" rel="noopener">Submit Case Details</a><a class="btn s" style="width:100%;margin-top:10px" href="#consult">Already submitted? Pay ₹100</a></div><section>${Warn()}</section></section>`,
services:()=>`<section><h1>Services</h1><div class="g g3">${SERVICES.map(s=>Card(s,"Evidence-based, lawful analysis.",`<span class="free">Investigation Fee: FREE</span>`)).join("")}</div></section><section>${Warn()}</section>`,
how:()=>`<section><h1>How It Works</h1>${Steps()}${CtaBand()}</section>`,
consult:()=>{const c=Api.myCase();let b;
 if(c&&c.pay=="Approved")b=`<div class="c" style="border-color:var(--ok)"><h2 style="color:var(--ok)">✅ PAYMENT VERIFIED</h2><p>Payment verified successfully.</p><p>Your Case ID</p><div class="big" style="font-size:30px">${c.id}</div><p>Your case has been received. Please use the official contact method configured by Money Trace Investigation to continue the consultation.</p><a class="btn s" style="width:100%" href="#track">Track Case</a></div>`;
 else if(c&&c.pay=="Pending")b=`<div class="c" style="border-color:#f59e0b"><h2>⏳ Payment Verification Pending</h2><p>Transaction ID <b style="color:#fff">${c.utr}</b> received. Our team is checking it in the payment account. Next steps appear only after approval.</p><button class="btn s" id="ck">Check Status</button></div>`;
 else if(c&&c.pay=="Rejected")b=NV+`<button class="btn s" id="rt">Try Again</button>`;
 else b=`<div class="c" style="text-align:center"><h3>Pay ₹100 after submitting your case details.</h3><p><a href="${CONFIG.FORM_URL}" target="_blank" rel="noopener">Haven’t submitted yet? Report a Fraud</a></p><img src="${QR}" alt="Payment QR code" width="300" height="300" style="width:100%;max-width:300px;height:auto;border-radius:12px;background:#fff"><p style="margin-top:8px"><b style="color:#fff">Scan this QR and pay exactly ₹100.</b></p><form id="pf" style="text-align:left"><label for="pn">Your Name</label><input id="pn" required><label for="pu">Enter your payment Transaction ID / UTR</label><input id="pu" inputmode="numeric" placeholder="Enter your UPI Transaction ID / UTR" required><button class="btn p" style="width:100%;margin-top:14px">Verify Payment</button></form><div id="pe"></div></div>`;
 return `<section><h1>₹100 Consultation</h1><div class="steps">${["Report a Fraud (form)","Scan QR","Pay ₹100","Enter Transaction ID","Verify Payment","Next steps"].map((x,i)=>`<span>${i+1}. ${x}</span>`).join("")}</div><div style="max-width:520px">${b}</div><p style="margin-top:14px"><b style="color:#fff">Consultation: ₹100 / 30 minutes · Investigation: FREE · Investigation report: FREE · Recovery fee: ₹0.</b> We do not promise recovery of money.</p>${Zero()}</section><section>${Warn()}</section>`},
track:()=>`<section><h1>Track Case</h1><form id="tf" class="c" style="max-width:520px"><label for="ci">Enter your Case ID</label><input id="ci" placeholder="MTI-2026-00001" required><button class="btn p" style="width:100%;margin-top:14px">Check Status</button></form><div id="tr" style="max-width:520px;margin-top:14px"></div><p style="font-size:13px;margin-top:10px">Only the status is shown. No personal details are displayed publicly.</p></section>`,
about:()=>`<section><h1>About Us</h1><p>Money Trace Investigation is an independent, India-based service that helps people who suspect they have been victims of online fraud. We analyze evidence you provide and publicly available information, then explain how to report findings to the right bank, platform or cybercrime authority.</p><p>We are not affiliated with any government body or police department.</p><h2>Why Money Trace Investigation?</h2><ul class="t"><li>Free investigation and report</li><li>Transparent ₹100 consultation</li><li>No recovery commission</li><li>Evidence-focused, privacy-conscious, lawful</li></ul>${Warn()}</section>`,
contact:()=>`<section><h1>Contact</h1><div class="g g2">${Card("Report a Fraud","Submit your case details through our Google Form.",`<a class="btn p" href="${CONFIG.FORM_URL}" target="_blank" rel="noopener">Report a Fraud</a>`)}${Card("Email","support@example.com (placeholder)")}</div><p style="margin-top:14px">If you are in immediate danger of losing funds, contact your bank and call the national cybercrime helpline <b style="color:#fff">1930</b>, or report at <a href="https://cybercrime.gov.in" target="_blank" rel="noopener">cybercrime.gov.in</a>.</p></section>`,
privacy:()=>`<section><h1>Privacy Policy</h1><p>Case details are submitted through a Google Form (a Google service with its own privacy policy). We collect only the details you submit (contact info, fraud details, evidence) to assess your case. Data is used solely for investigation and communication with you, is not sold, and is shared only as needed to guide you or as required by law.</p><p>We never ask for OTPs, PINs, CVV or passwords. You may request deletion of your data by contacting us. (Draft text — to be reviewed by a legal professional before launch.)</p></section>`,
terms:()=>`<section><h1>Terms & Conditions</h1><p>The ₹100 fee covers a 30-minute consultation only. Investigation and investigation reports are free. We charge no recovery fee or commission.</p><p>We do not guarantee recovery of funds, identification of suspects, arrests or account freezing. Such actions are the responsibility of banks, payment providers, police, cybercrime authorities and courts.</p><p>You confirm that information you provide is yours or you are authorized to share it. We use lawful methods only. (Draft — to be reviewed by a legal professional.)</p></section>`,
};
/* ===== Router + events ===== */
const app=document.getElementById("app"),nav=document.getElementById("m");
function render(){
 const k=(location.hash||"#home").slice(1);const key=P[k]?k:"home";
 app.innerHTML=P[key]();
 nav.innerHTML=PAGES.map(p=>`<a href="#${p[0]}" class="${p[0]==key?"on":""}">${p[1]}</a>`).join("");nav.classList.remove("o");
 document.getElementById("ft").innerHTML=`<p>© 2026 ${CONFIG.BRAND}. Trace the Evidence. Help Stop Online Fraud.</p><p>Not affiliated with any government or police authority. No guarantee of recovery.</p><p><a href="#privacy">Privacy</a><a href="#terms">Terms</a><a href="#contact">Contact</a></p>`;
 document.title=(PAGES.find(p=>p[0]==key)[1])+" · Money Trace Investigation";window.scrollTo(0,0);document.getElementById("wa").href=CONFIG.FORM_URL;bind(key);
}
function bind(k){
 const $=id=>document.getElementById(id);
 if(k=="consult"){
  if($("pf"))$("pf").onsubmit=e=>{e.preventDefault();const n=$("pn").value.trim(),u=$("pu").value.replace(/\s/g,"");
   if(n&&Api.submitPayment(n,u).ok)render();else $("pe").innerHTML=NV};
  if($("rt"))$("rt").onclick=()=>{Store.set("mti_my",null);render()};
  if($("ck"))$("ck").onclick=render}
 if(k=="track")$("tf").onsubmit=e=>{e.preventDefault();const id=$("ci").value.trim().toUpperCase();const c=cases.find(x=>x.id==id&&x.pay=="Approved");
  $("tr").innerHTML=c?`<div class="c"><h3>${c.id}</h3><p>Current status: <b style="color:#fff">${STATUS[c.status]}</b></p><div class="steps">${STATUS.map((s,i)=>`<span class="${i<=c.status?"d":""}">${s}</span>`).join("")}</div></div>`:`<div class="c"><p>No case found for that ID.</p></div>`};
 }
document.getElementById("mb").onclick=()=>nav.classList.toggle("o");
addEventListener("hashchange",render);render();
</script></body></html>
